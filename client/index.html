<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pizzas disponibles</title>

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script type="module" src="app.mjs"></script>
</head>

<body class="bg-light">


  <main class="container py-4">
    <h1 class="mb-4">Pizzas disponibles</h1>


    <section class="card mb-4">
      <div class="card-body">
        <form id="filter-form">
          <div class="row g-3 align-items-end">


            <div class="col-md-5">
              <label for="ingredients" class="form-label">
                Ingrédients (séparés par des virgules)
              </label>
              <input type="text" id="ingredients" class="form-control" placeholder="Tomate, Mozza">
            </div>


            <div class="col-md-4">
              <label for="match-mode" class="form-label">
                Correspondance
              </label>
              <select id="match-mode" class="form-select">
                <option value="or">
                  OU — au moins un ingrédient
                </option>
                <option value="and">
                  ET — tous les ingrédients
                </option>
              </select>
            </div>


            <div class="col-md-3">
              <button type="submit" class="btn btn-primary w-100">
                Filtrer
              </button>
            </div>


          </div>
        </form>
      </div>
    </section>


    <div class="row g-4">
      <section class="col-md-6">
        <div class="card h-100">
          <div class="card-header">
            <h2 class="h5 mb-0">Liste des pizzas</h2>
          </div>
          <div class="card-body">
            <div id="pizza-list" class="list-group">
              <!-- Les pizzas seront affichées ici -->
            </div>
            <p id="message" class="text-muted mt-3 mb-0"></p>
          </div>
        </div>
      </section>


      <section class="col-md-6">
        <div class="card h-100">
          <div class="card-header">
            <h2 class="h5 mb-0">Détail</h2>
          </div>
          <div id="pizza-detail" class="card-body">
            <p class="text-muted">
              Sélectionnez une pizza pour afficher ses ingrédients.
            </p>
          </div>
        </div>
      </section>
    </div>
  </main>


</body>

</html>
